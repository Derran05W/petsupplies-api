name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    # Uncomment when integration tests need a real DB (Phase 4+).
    # services:
    #   postgres:
    #     image: postgres:16
    #     env:
    #       POSTGRES_USER: postgres
    #       POSTGRES_PASSWORD: postgres
    #       POSTGRES_DB: petsupplies_test
    #     ports:
    #       - 5432:5432
    #     options: >-
    #       --health-cmd "pg_isready -U postgres"
    #       --health-interval 10s
    #       --health-timeout 5s
    #       --health-retries 5
    # When enabling the service also:
    # - Set env.DATABASE_URL: postgresql://postgres:postgres@localhost:5432/petsupplies_test
    # - Add a "Run migrations" step before tests: run: pnpm prisma migrate deploy

    env:
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      # pnpm/action-setup must come before actions/setup-node so that
      # setup-node's `cache: pnpm` can find pnpm on PATH.
      # Version is read from `packageManager` in package.json — no need to pin here too.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test
